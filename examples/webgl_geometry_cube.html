<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - geometry - cube</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device.width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.3/tween.umd.js"></script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.module.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        
        const edgeOptions = {
            show: true,
            color: '#000000'
        };

        const geometryOptions = {
            radius: 0.1,
            segments: 8
        };

        const initialValues = {
            moveCube: true, 
            mode: 'Letras',
            zoom: 5,
            cubePosition: { x: 0, y: 0.5, z: 0 },
            cubeRotation: { x: 0, y: 0, z: 0 },
            fontSize: 50,
            enableLogs: false,
            faceTexts: ['A', 'B', 'C', 'D', 'E', 'F'],
            letterBgColor: '#FFFFFF',
            letterTextColor: '#000000',
            randomColors: false
        };

        let camera, scene, renderer, controls;
        let mesh, geometry, texture;
        let axesHelper;
        let edgesMesh; 
        let enableLogs = initialValues.enableLogs;
        let isCubeMoving = initialValues.moveCube;

        // MODIFICADO: Se declara aquí para que sea accesible globalmente.
        let materialOptions; 

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isAnimating = false;

        const diceOptions = {
            bounciness: 0.6
        };
        
        let activateRotationControl; 
        let faceTextInputControls = [];
        let letterBgColorControl, letterTextColorControl, randomColorsControl;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = initialValues.zoom;
            scene.background = new THREE.Color(0x000000);

            texture = new THREE.TextureLoader().load('textures/crate.gif');
            texture.colorSpace = THREE.SRGBColorSpace;

            geometry = new RoundedBoxGeometry(1, 1, 1, geometryOptions.segments, geometryOptions.radius);

            mesh = new THREE.Mesh(geometry);
            mesh.position.set(initialValues.cubePosition.x, initialValues.cubePosition.y, initialValues.cubePosition.z);
            mesh.rotation.set(initialValues.cubeRotation.x, initialValues.cubeRotation.y, initialValues.cubeRotation.z);
            scene.add(mesh);

            const edgesGeometry = new THREE.EdgesGeometry(geometry);
            const edgesMaterial = new THREE.LineBasicMaterial({ color: edgeOptions.color, linewidth: 2 });
            edgesMesh = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            mesh.add(edgesMesh);


            updateMaterial(initialValues.mode);

            axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            const planeGeometry = new THREE.PlaneGeometry(20, 20);
            const planeMaterial = new THREE.MeshBasicMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = Math.PI / 2;
            scene.add(plane);

            renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enabled = true;
            
            setupGUI();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onCubeClick, false);
        }
        
        function updateGeometry() {
            if (mesh) {
                mesh.geometry.dispose();
                geometry = new RoundedBoxGeometry(1, 1, 1, Math.floor(geometryOptions.segments), geometryOptions.radius);
                mesh.geometry = geometry;

                if (edgesMesh) {
                    edgesMesh.geometry.dispose();
                    edgesMesh.geometry = new THREE.EdgesGeometry(geometry);
                }

                // CORREGIDO: Llama a updateMaterial con el modo *actual*, no el inicial.
                updateMaterial(materialOptions.mode);
            }
        }
        
        function createTextTexture(text, fontSize, bgColor, textColor) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 256;
            canvas.width = size; canvas.height = size;

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, size, size);

            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillStyle = textColor;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, size / 2, size / 2);
            return new THREE.CanvasTexture(canvas);
        }

        function getRandomHexColor() {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        function setupGUI() {
            const gui = new GUI();
            const diceFolder = gui.addFolder('Animación del Dado');
            diceFolder.add(diceOptions, 'bounciness', 0, 1).name('Rebote (Bounciness)').step(0.01);
            diceFolder.open();
            
            const geometryFolder = gui.addFolder('Geometría del Dado');
            geometryFolder.add(geometryOptions, 'radius', 0, 0.5).name('Curvatura (Radio)').step(0.01).onFinishChange(updateGeometry);
            geometryFolder.add(geometryOptions, 'segments', 1, 20).name('Suavidad (Segmentos)').step(1).onFinishChange(updateGeometry);
            geometryFolder.add(edgeOptions, 'show').name('Mostrar Contorno').onChange((value) => {
                edgesMesh.visible = value;
            });
            geometryFolder.addColor(edgeOptions, 'color').name('Color Contorno').onChange((value) => {
                edgesMesh.material.color.set(value);
            });
            geometryFolder.open();

            const materialFolder = gui.addFolder('Material');
            // MODIFICADO: Se inicializa la variable global.
            materialOptions = { mode: initialValues.mode };
            
            const fontSizeControl = materialFolder.add(initialValues, 'fontSize', 50, 200).name('Tamaño de la letra').step(1).onChange(() => updateMaterial(materialOptions.mode));
            
            letterBgColorControl = materialFolder.addColor(initialValues, 'letterBgColor').name('Fondo de Letra').onChange(() => updateMaterial(materialOptions.mode));
            letterTextColorControl = materialFolder.addColor(initialValues, 'letterTextColor').name('Color de Letra').onChange(() => updateMaterial(materialOptions.mode));
            randomColorsControl = materialFolder.add(initialValues, 'randomColors').name('Colores Aleatorios').onChange((value) => {
                letterBgColorControl.domElement.style.pointerEvents = value ? 'none' : 'auto';
                letterBgColorControl.domElement.style.opacity = value ? 0.5 : 1;
                letterTextColorControl.domElement.style.pointerEvents = value ? 'none' : 'auto';
                letterTextColorControl.domElement.style.opacity = value ? 0.5 : 1;
                updateMaterial(materialOptions.mode);
            });

            initialValues.faceTexts.forEach((text, index) => {
                const control = materialFolder.add(initialValues.faceTexts, index)
                    .name(`Cara ${String.fromCharCode(65 + index)}`)
                    .listen()
                    .onChange(() => updateMaterial(materialOptions.mode))
                    .onFinishChange((value) => {
                        initialValues.faceTexts[index] = value.substring(0, 3).toUpperCase();
                        updateMaterial(materialOptions.mode);
                    });
                control.domElement.querySelector('input').setAttribute('maxlength', '3');
                faceTextInputControls.push(control);
            });

            materialFolder.add(materialOptions, 'mode', ['Textura', 'Wireframe', 'Color', 'Letras']).name('Modo de Material').onChange((value) => {
                materialOptions.mode = value;
                const toggleLetterControls = (show) => {
                    fontSizeControl.domElement.style.display = show ? '' : 'none';
                    letterBgColorControl.domElement.style.display = show ? '' : 'none';
                    letterTextColorControl.domElement.style.display = show ? '' : 'none';
                    randomColorsControl.domElement.style.display = show ? '' : 'none';
                    faceTextInputControls.forEach(control => {
                        control.domElement.style.display = show ? '' : 'none';
                    });
                    const disableColorControls = show && initialValues.randomColors;
                    letterBgColorControl.domElement.style.pointerEvents = disableColorControls ? 'none' : 'auto';
                    letterBgColorControl.domElement.style.opacity = disableColorControls ? 0.5 : 1;
                    letterTextColorControl.domElement.style.pointerEvents = disableColorControls ? 'none' : 'auto';
                    letterTextColorControl.domElement.style.opacity = disableColorControls ? 0.5 : 1;
                };
                toggleLetterControls(value === 'Letras');
                updateMaterial(value);
            });
            
            const isLettersMode = initialValues.mode === 'Letras';
            fontSizeControl.domElement.style.display = isLettersMode ? '' : 'none';
            letterBgColorControl.domElement.style.display = isLettersMode ? '' : 'none';
            letterTextColorControl.domElement.style.display = isLettersMode ? '' : 'none';
            randomColorsControl.domElement.style.display = isLettersMode ? '' : 'none';
            faceTextInputControls.forEach(control => {
                control.domElement.style.display = isLettersMode ? '' : 'none';
            });
            if (isLettersMode && initialValues.randomColors) {
                letterBgColorControl.domElement.style.pointerEvents = 'none';
                letterBgColorControl.domElement.style.opacity = 0.5;
                letterTextColorControl.domElement.style.pointerEvents = 'none';
                letterTextColorControl.domElement.style.opacity = 0.5;
            }

            materialFolder.open();
            
            // ... (el resto de la función setupGUI y del script permanece igual) ...
            const cubeFolder = gui.addFolder('Controles del Cubo');
            cubeFolder.add(mesh.rotation, 'x', 0, Math.PI * 2).name('Rotación X').listen();
            cubeFolder.add(mesh.rotation, 'y', 0, Math.PI * 2).name('Rotación Y').listen();
            cubeFolder.add(mesh.rotation, 'z', 0, Math.PI * 2).name('Rotación Z').listen();
            cubeFolder.add(mesh.position, 'x', -10, 10).name('Mover X').listen();
            cubeFolder.add(mesh.position, 'y', -10, 10).name('Mover Y').listen();
            cubeFolder.add(mesh.position, 'z', -10, 10).name('Mover Z').listen();
            cubeFolder.open();
            const generalFolder = gui.addFolder('General');
            const movementOptions = { moveCube: initialValues.moveCube };
            activateRotationControl = generalFolder.add(movementOptions, 'moveCube').name('Activar Rotación Auto.').onChange((value) => { isCubeMoving = value; });
            generalFolder.add(camera.position, 'z', 0.1, 10).name('Zoom').step(0.1);
            generalFolder.add({ reset: resetCube }, 'reset').name('Resetear Cubo');
            const axesOptions = { showAxes: true };
            generalFolder.add(axesOptions, 'showAxes').name('Mostrar Ejes').onChange(toggleAxes);
            const controlsOptions = { enableControls: true };
            generalFolder.add(controlsOptions, 'enableControls').name('Habilitar Controles').onChange(toggleControls);
            generalFolder.add(initialValues, 'enableLogs').name('Activar Logs').onChange(value => enableLogs = value);
            generalFolder.open();
        }
        function onCubeClick(event) { if (isAnimating) return; mouse.x = (event.clientX / window.innerWidth) * 2 - 1; mouse.y = - (event.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(mouse, camera); const intersects = raycaster.intersectObjects([mesh]); if (intersects.length > 0) { rollDice(); } }
        function rollDice() { isAnimating = true; isCubeMoving = false; if (activateRotationControl) { activateRotationControl.setValue(false); activateRotationControl.updateDisplay(); } const targetRotations = [ { x: 0, y: Math.PI * Math.round(Math.random() * 4), z: 0 }, { x: Math.PI, y: Math.PI * Math.round(Math.random() * 4), z: 0 }, { x: -Math.PI / 2, y: Math.PI * Math.round(Math.random() * 4), z: 0 }, { x: Math.PI / 2, y: Math.PI * Math.round(Math.random() * 4), z: 0 }, { x: 0, y: Math.PI * Math.round(Math.random() * 4), z: Math.PI / 2 }, { x: 0, y: Math.PI * Math.round(Math.random() * 4), z: -Math.PI / 2 } ]; const finalRotation = targetRotations[Math.floor(Math.random() * targetRotations.length)]; const tossHeight = 3 + Math.random() * 2; const totalDuration = 1200 + diceOptions.bounciness * 800; const tossUp = new TWEEN.Tween(mesh.position).to({ y: tossHeight }, totalDuration * 0.3).easing(TWEEN.Easing.Quadratic.Out); const randomRotation = new TWEEN.Tween(mesh.rotation).to({x: mesh.rotation.x + (Math.random() * 8 - 4) * Math.PI, y: mesh.rotation.y + (Math.random() * 8 - 4) * Math.PI, z: mesh.rotation.z + (Math.random() * 8 - 4) * Math.PI}, totalDuration).easing(TWEEN.Easing.Linear.None); const finalSettleRotation = new TWEEN.Tween(mesh.rotation).to(finalRotation, totalDuration * 0.7).easing(TWEEN.Easing.Quadratic.InOut); let fallAndBounce = new TWEEN.Tween(mesh.position).to({y: 0.5}, totalDuration * 0.15).easing(TWEEN.Easing.Quadratic.In); let lastBounceTween = fallAndBounce; let numBounces = Math.round(diceOptions.bounciness * 4); let currentBounceHeight = tossHeight * 0.4 * diceOptions.bounciness; for (let i = 0; i < numBounces; i++) { if (currentBounceHeight < 0.1) break; const bounceUp = new TWEEN.Tween(mesh.position).to({ y: 0.5 + currentBounceHeight }, totalDuration * 0.15 / (i + 1)).easing(TWEEN.Easing.Quadratic.Out); const bounceDown = new TWEEN.Tween(mesh.position).to({ y: 0.5 }, totalDuration * 0.15 / (i + 1)).easing(TWEEN.Easing.Quadratic.In); lastBounceTween.chain(bounceUp); bounceUp.chain(bounceDown); lastBounceTween = bounceDown; currentBounceHeight *= 0.5; } lastBounceTween.onComplete(() => { isAnimating = false; }); tossUp.chain(fallAndBounce); tossUp.start(); randomRotation.start(); tossUp.onComplete(() => finalSettleRotation.start()); }
        function resetCube() { mesh.rotation.set(initialValues.cubeRotation.x, initialValues.cubeRotation.y, initialValues.cubeRotation.z); mesh.position.set(initialValues.cubePosition.x, initialValues.cubePosition.y, initialValues.cubePosition.z); camera.position.set(0, 0, initialValues.zoom); }
        function toggleAxes(value) { axesHelper.visible = value; }
        function toggleControls(value) { controls.enabled = value; }
        function updateMaterial(mode) { if (mode === 'Wireframe') { mesh.material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true }); } else if (mode === 'Color') { const colors = []; for (let i = 0; i < geometry.attributes.position.count; i++) { colors.push(Math.random(), Math.random(), Math.random()); } geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3)); mesh.material = new THREE.MeshBasicMaterial({ vertexColors: true }); } else if (mode === 'Letras') { const faceTextures = initialValues.faceTexts.map((text, index) => { let bgColor = initialValues.letterBgColor; let textColor = initialValues.letterTextColor; if (initialValues.randomColors) { bgColor = getRandomHexColor(); textColor = getRandomHexColor(); if (bgColor === textColor) textColor = getRandomHexColor(); } return createTextTexture(text, initialValues.fontSize, bgColor, textColor); }); mesh.material = faceTextures.map(tex => new THREE.MeshBasicMaterial({ map: tex })); } else { mesh.material = new THREE.MeshBasicMaterial({ map: texture }); } }
        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        function animate() { requestAnimationFrame(animate); TWEEN.update(); if (isCubeMoving && !isAnimating) { mesh.rotation.y += 0.04; } controls.update(); renderer.render(scene, camera); }

    </script>
</body>
</html>
